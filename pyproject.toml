[project]
name = "ashbal-quran"
version = "0.1.0"
description = "منصة أشبال القرآن — إدارة حفظ القرآن الكريم"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.9",
    "pytz>=2026.1.post1",
    "sqlalchemy>=2.0.47",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.1.6",
    "setuptools>=69.0.0",
]

# Vercel يكتشف Flask تلقائيًا من وجود كائن app في main.py،
# وهذا القسم يثبّت نقطة الدخول وأمر البناء صراحةً.
[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python build.py"

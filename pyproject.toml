[project]
name = "ashbal-quran"
version = "0.1.0"
description = "منصة أشبال القرآن — إدارة حفظ القرآن الكريم"
requires-python = ">=3.11"
# مثبّتة على نفس إصدارات requirements.txt تمامًا ليكون المصدران متوافقين
# أيَّهما اختاره Vercel. المصدر المعتمد هو requirements.txt.
dependencies = [
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.2.2",
    "SQLAlchemy==2.0.51",
    "Werkzeug==3.1.8",
    "psycopg2-binary==2.9.13",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.3",
    "pytz==2026.2",
    "setuptools>=69.0.0",
]

# يثبّت Vercel نقطة الدخول وأمر البناء صراحةً.
# (Flask يُكتشف تلقائيًا من كائن app في main.py أيضًا.)
[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python build.py"

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحات الحفظ - أشبال القرآن</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 1rem;
        }
        .container-custom {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .student-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .btn-save {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border-radius: 2rem;
            padding: 0.3rem 1.2rem;
            border: none;
            font-weight: 600;
        }
        .btn-back {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container-custom">
        <div class="header-card d-flex justify-content-between align-items-center">
            <h2 class="mb-0"><i class="fas fa-book-open text-success ms-2"></i> صفحات الحفظ للطلاب</h2>
            <a href="{{ url_for('admin', tab='dashboard') }}" class="btn-back">
                <i class="fas fa-arrow-right ms-2"></i> العودة
            </a>
        </div>

        <div class="row">
            {% for item in student_pages %}
            <div class="col-md-6 col-lg-4">
                <div class="student-card">
                    <h5 class="mb-2">{{ item.student.full_name }}</h5>
                    <p class="text-muted small mb-2">@{{ item.student.username }}</p>

                    <form method="post" action="{{ url_for('update_student_pages', student_id=item.student.id) }}">
                        <div class="mb-2">
                            <label class="form-label small fw-bold">عدد الصفحات المحفوظة</label>
                            <input type="number" name="total_pages" class="form-control form-control-sm" 
                                   value="{{ item.pages }}" min="0" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">ملاحظات</label>
                            <textarea name="notes" class="form-control form-control-sm" rows="2">{{ item.notes }}</textarea>
                        </div>
                        <button type="submit" class="btn-save w-100">
                            <i class="fas fa-save ms-1"></i> حفظ
                        </button>
                    </form>

                    {% if item.last_updated %}
                    <div class="mt-2 text-muted small">
                        <i class="fas fa-clock ms-1"></i> آخر تحديث: {{ item.last_updated.strftime('%Y-%m-%d') }}
                    </div>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!-- edit_student.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>تعديل طالب - أشبال القرآن</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #28a745;
            --secondary-color: #20c997;
            --dark-color: #2c3e50;
            --light-bg: #f4f7fc;
            --border-radius-lg: 2rem;
            --border-radius-md: 1.5rem;
            --border-radius-sm: 1rem;
            --box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.08);
        }
        html { font-size: 16px; }
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: var(--light-bg);
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
        }
        .mobile-container { max-width: 600px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow);
            border: none;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem;
        }
        .card-header h2 { font-size: clamp(1.4rem, 6vw, 1.8rem); margin: 0; }
        .card-body { padding: 1.5rem; }
        .form-label { font-weight: 600; color: var(--dark-color); }
        .form-control {
            border-radius: var(--border-radius-sm);
            padding: 0.8rem 1rem;
            border: 1px solid #e1e8ed;
            background: #f8fafc;
        }
        .btn-group-bottom {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        .btn-submit {
            flex: 2;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: var(--border-radius-md);
            padding: 0.9rem;
            color: white;
            font-weight: 600;
        }
        .btn-cancel {
            flex: 1;
            background: #6c757d;
            border-radius: var(--border-radius-md);
            padding: 0.9rem;
            color: white;
            text-decoration: none;
            text-align: center;
        }
        @media (max-width: 400px) { .btn-group-bottom { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-user-edit ms-2"></i> تعديل بيانات الطالب</h2>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" value="{{ student.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور (اتركه فارغاً إذا لم ترد التغيير)</label>
                        <input type="password" name="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">مستوى الحفظ</label>
                        <input type="text" name="level" class="form-control" value="{{ student.memorization_level or '' }}">
                    </div>
                    <div class="btn-group-bottom">
                        <button type="submit" class="btn-submit"><i class="fas fa-save ms-2"></i> حفظ</button>
                        <a href="{{ url_for('admin', tab='students') }}" class="btn-cancel"><i class="fas fa-times ms-2"></i> إلغاء</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

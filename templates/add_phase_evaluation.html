<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة تقييم مرحلة - أشبال القرآن</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 1rem;
        }
        .container-custom {
            max-width: 600px;
            margin: 0 auto;
        }
        .header-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .form-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            border-radius: 2rem;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .btn-save {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border-radius: 2rem;
            padding: 0.7rem 2rem;
            border: none;
            font-weight: 600;
            width: 100%;
        }
        .btn-cancel {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .info-box {
            background: #e3f2fd;
            border-radius: 1rem;
            padding: 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container-custom">
        <div class="header-card">
            <h2 class="mb-0"><i class="fas fa-star text-warning ms-2"></i> إضافة تقييم مرحلة</h2>
            <p class="text-muted mb-0 mt-2">{{ student.full_name }}</p>
        </div>

        <div class="form-card">
            <div class="info-box">
                <i class="fas fa-info-circle ms-1"></i>
                تقييم المرحلة من 80 درجة، وسيتم إضافتها إلى 20% من متوسط درجات الحفظ
            </div>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">تاريخ التقييم</label>
                    <input type="date" name="evaluation_date" class="form-control" value="{{ now.strftime('%Y-%m-%d') }}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">رقم المرحلة</label>
                        <input type="number" name="phase_number" class="form-control" placeholder="مثال: 1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">اسم المرحلة</label>
                        <input type="text" name="phase_name" class="form-control" placeholder="مثال: جزء عم">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">الدرجة (من 80)</label>
                    <input type="number" name="score" class="form-control" min="0" max="80" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-save mt-3">
                    <i class="fas fa-save ms-2"></i> حفظ التقييم
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('view_student_plans', student_id=student.id) }}" class="btn-cancel">
                    <i class="fas fa-times ms-2"></i> إلغاء
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة مقرر أسبوعي للطالب {{ student.full_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <script>
        function toggleFields() {
            var planType = document.querySelector('input[name="plan_type"]:checked').value;
            document.getElementById('hifdh_fields').style.display = planType === 'حفظ' ? 'block' : 'none';
            document.getElementById('sard_fields').style.display = planType === 'سرد' ? 'block' : 'none';
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <h2>إضافة مقرر أسبوعي للطالب: {{ student.full_name }}</h2>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">نوع المقرر</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="plan_type" id="type_hifdh" value="حفظ" checked onclick="toggleFields()">
                    <label class="form-check-label" for="type_hifdh">حفظ</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="plan_type" id="type_sard" value="سرد" onclick="toggleFields()">
                    <label class="form-check-label" for="type_sard">سرد</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">تاريخ بداية الأسبوع (الأحد)</label>
                <input type="date" name="start_date" class="form-control" required 
                       min="{{ today }}" value="{{ today }}" 
                       pattern="\d{4}-\d{2}-\d{2}" title="اختر يوم الأحد">
                <small class="text-muted">يجب أن يكون الأحد. المقرر يمتد 6 أيام حتى السبت.</small>
            </div>

            <!-- حقول الحفظ -->
            <div id="hifdh_fields">
                <div class="mb-3">
                    <label class="form-label">الحفظ الجديد (ما سيحفظه الطالب)</label>
                    <textarea name="new_memorization" class="form-control" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">الحفظ القريب (مراجعة)</label>
                    <textarea name="recent_review" class="form-control" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">الحفظ السابق (مراجعة)</label>
                    <textarea name="previous_review" class="form-control" rows="2"></textarea>
                </div>
            </div>

            <!-- حقول السرد -->
            <div id="sard_fields" style="display:none;">
                <div class="mb-3">
                    <label class="form-label">مقرر السرد الأسبوعي</label>
                    <textarea name="revision_text" class="form-control" rows="3"></textarea>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">ملاحظات</label>
                <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">حفظ المقرر</button>
            <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>

    <script>
        // تعيين الحد الأدنى للتاريخ إلى اليوم (الأحد)
        // يمكن إضافة تحقق من أن اليوم هو الأد
        document.addEventListener('DOMContentLoaded', function() {
            var dateInput = document.querySelector('input[name="start_date"]');
            dateInput.addEventListener('change', function() {
                var selectedDate = new Date(this.value);
                if (selectedDate.getDay() !== 0) { // 0 = الأحد
                    askAlert('يرجى اختيار يوم الأحد فقط.');
                    this.value = '{{ today }}';
                }
            });
        });
    </script>
    <script src="{{ url_for('static', filename='js/confirm-modal.js') }}"></script>
</body>
</html>

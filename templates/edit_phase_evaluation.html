<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تعديل تقييم المرحلة - أشبال القرآن</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f5f7fa; min-height: 100vh; padding: 1.5rem; }
        .card { max-width: 600px; margin: 1rem auto; border: 0; border-radius: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
        .card-body { padding: 2rem; }
    </style>
</head>
<body>
    <main class="card">
        <div class="card-body">
            <h1 class="h4 mb-2">تعديل تقييم المرحلة</h1>
            <p class="text-muted">{{ evaluation.student.full_name }}</p>
            <form method="post">
                <div class="mb-3">
                    <label for="evaluation_date" class="form-label">تاريخ التقييم</label>
                    <input type="date" id="evaluation_date" name="evaluation_date" class="form-control" value="{{ evaluation.evaluation_date.isoformat() }}" required>
                </div>
                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label for="phase_number" class="form-label">رقم المرحلة</label>
                        <input type="number" id="phase_number" name="phase_number" class="form-control" value="{{ evaluation.phase_number if evaluation.phase_number is not none else '' }}">
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label for="phase_name" class="form-label">اسم المرحلة</label>
                        <input type="text" id="phase_name" name="phase_name" class="form-control" value="{{ evaluation.phase_name or '' }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="score" class="form-label">الدرجة (من 80)</label>
                    <input type="number" id="score" name="score" min="0" max="80" class="form-control" value="{{ evaluation.score }}" required>
                </div>
                <div class="mb-3">
                    <label for="notes" class="form-label">ملاحظات</label>
                    <textarea id="notes" name="notes" rows="3" class="form-control">{{ evaluation.notes or '' }}</textarea>
                </div>
                <button type="submit" class="btn btn-success">حفظ التعديل</button>
                <a href="{{ url_for('view_student_plans', student_id=evaluation.student_id) }}" class="btn btn-outline-secondary">إلغاء</a>
            </form>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>تغيير كلمة المرور - أشبال القرآن</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: #f4f7fc;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-container { max-width: 450px; width: 100%; }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 2rem 1.5rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.05);
            border: none;
        }
        h2 { color: #2c3e50; font-weight: 700; margin-bottom: 2rem; text-align: center; }
        .form-label { font-weight: 600; color: #2c3e50; }
        .form-control {
            border-radius: 50px;
            padding: 0.7rem 1.2rem;
            border: 1px solid #ddd;
            background: #f8fafc;
            margin-bottom: 1rem;
        }
        .btn-submit {
            background: #28a745;
            border: none;
            border-radius: 50px;
            padding: 0.8rem;
            color: white;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
        }
        .btn-cancel {
            background: #6c757d;
            border-radius: 50px;
            padding: 0.8rem;
            color: white;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 0.5rem;
        }
        .alert-custom {
            border-radius: 50px;
            padding: 0.7rem 1.2rem;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="card">
            <h2><i class="fas fa-key text-success"></i> تغيير كلمة المرور</h2>
            <form method="post">
                <div><label class="form-label">كلمة المرور الحالية</label><input type="password" name="current_password" class="form-control" required></div>
                <div><label class="form-label">كلمة المرور الجديدة</label><input type="password" name="new_password" class="form-control" required></div>
                <div><label class="form-label">تأكيد كلمة المرور الجديدة</label><input type="password" name="confirm_password" class="form-control" required></div>
                <button type="submit" class="btn-submit">تغيير</button>
                <a href="javascript:history.back()" class="btn-cancel">إلغاء</a>
            </form>
            {% if error %}<div class="alert-custom alert-danger">{{ error }}</div>{% endif %}
            {% if success %}<div class="alert-custom alert-success">{{ success }}</div>{% endif %}
        </div>
    </div>
</body>
</html>

<!-- missing_reports_form.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>شاشة التقارير </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #28a745;
            --secondary-color: #20c997;
            --dark-color: #2c3e50;
            --light-bg: #f4f7fc;
            --border-radius-lg: 2rem;
            --border-radius-md: 1.5rem;
            --border-radius-sm: 1rem;
            --box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: var(--dark-color);
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-label {
            font-weight: 600;
            color: var(--dark-color);
        }
        .form-control, .form-select {
            border-radius: 50px;
            padding: 0.7rem 1.2rem;
            border: 1px solid #e1e8ed;
            background: #f8fafc;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }
        select.form-select {
            background: #d0e8f7;
            color: #0a3d62;
            font-weight: 600;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.25);
            border-color: var(--primary-color);
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 50px;
            padding: 0.8rem;
            color: white;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        .btn-back {
            background: #6c757d;
            border-radius: 50px;
            padding: 0.7rem 1.5rem;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background: #5a6268;
            color: white;
        }
        .info-text {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .info-note {
            background: #e7f3ff;
            border-right: 3px solid #17a2b8;
            padding: 0.5rem 0.8rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            color: #0c5460;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2><i class="fas fa-chart-line ms-2"></i> تقرير الطلاب</h2>
        <p class="info-text">اختر نوع التقرير والتاريخ المطلوب</p>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">نوع التقرير</label>
                <select name="report_type" class="form-select" required>
                    <option value="cumulative">التقرير التراكمي (أرسل/لم يرسل)</option>
                    <option value="missing_plans">تقرير المقررات الأسبوعية (طلاب بدون مقرر)</option>
                </select>
                <div class="info-note">
                    <i class="fas fa-info-circle ms-1"></i>
                    <strong>تقرير المقررات الأسبوعية:</strong> يعرض الطلاب الذين ليس لديهم مقرر أسبوعي للأسبوع المحدد. 
                    <strong>ملاحظة:</strong> يجب اختيار يوم الأحد فقط لهذا التقرير.
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">اختر التاريخ</label>
                <input type="date" name="report_date" class="form-control" value="{{ today }}" required>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-search ms-2"></i> عرض التقرير</button>
        </form>

        <script>
        document.querySelector('[name="report_type"]').addEventListener('change', function() {
            var dateInput = document.querySelector('[name="report_date"]');
            if (this.value === 'missing_plans') {
                dateInput.value = '{{ next_sunday }}';
            } else {
                dateInput.value = '{{ today }}';
            }
        });
        </script>

        <div class="text-center mt-3">
            {% if is_teacher %}
                <a href="{{ url_for('teacher_dashboard') }}" class="btn-back"><i class="fas fa-arrow-right ms-2"></i> العودة للوحة المعلم</a>
            {% else %}
                <a href="{{ url_for('admin') }}" class="btn-back"><i class="fas fa-arrow-right ms-2"></i> العودة للإدارة</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
